name: Comprobar noticias

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validar_noticias.py noticias.json
      - run: for f in archivo/*.json; do python3 scripts/validar_noticias.py "$f"; done
